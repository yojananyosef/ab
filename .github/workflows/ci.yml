# Analisis, pruebas y compilacion de la version web.
#
# ============================================================================
# Y POR QUE AQUI **NO** SE PUBLICA, Y QUE SE PUBLICA EN SU LUGAR
# ============================================================================
#
# Medido el 5 de octubre de 2026: `ab` estaba desplegado desde este workflow, y con GitHub
# Actions en `major_outage` el **sitio entero** dejo de poder actualizarse:
#
#     The job was not acquired by Runner of type hosted even after multiple attempts
#
# Que la publicacion dependiera de que Actions tuviera corredores de sobra no es una
# decision, es lo que pasa cuando el unico sitio donde compilar Flutter es una maquina de
# GitHub. Y aqui **si** hay Flutter: esta maquina compila, pasa las pruebas, levanta el
# servidor y saca capturas.
#
# Asi que el reparto queda asi, y cada parte va donde puede dar de si:
#
# | | |
# | --- | --- |
# | **este workflow** | `analyze`, pruebas y `build web` en una maquina que **no** es la nuestra |
# | **`scripts/publicar.sh`** | las mismas comprobaciones y la publicacion, en local |
#
# Lo que se le quita a este workflow es **solo** el paso de desplegar. Lo que hacia el --
# comprobar el motor SQLite, dejar `404.html`, verificar que la app arranca-- se queda,
# porque es lo que hace falta para saber que **el paquete** sirve, y el paquete es lo que
# se publica.
#
# Y NO SE SUSTITUYE UNO POR OTRO. Los dos hacen las mismas comprobaciones antes de subir: si
# el CI pasara con un fallo, el script de local tambien, porque corre el mismo
# `flutter analyze` y el mismo `flutter test` antes de tocar nada.

name: verificar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Y SIN `pages: write` NI `id-token: write`, porque aqui **no** se despliega. Un permiso que
# no se usa es un permiso de mas: lo unico que hacen es ampliar lo que un workflow comprometido
# puede hacer. Quedan en `contents: read`.
permissions:
  contents: read

# Que una pusgada nueva cancele la anterior: si alguien empuja cinco veces
# seguidas, no tiene sentido verificar las cinco builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      # Las tres ordenes de AGENTS.md, en el orden en que estan escritas.
      # `flutter analyze` y `flutter test` en verde son parte de terminar una
      # tarea, no un extra.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # LOS MODULOS REALES, ANTES DE LAS PRUEBAS.
      #
      # Cuatro ficheros de pruebas necesitan un `.amod` de verdad, de 22 y 57 MiB,
      # y **no se versionan**: fijarlos haria que las pruebas comprobaran una
      # version vieja en vez de lo que se publica hoy. Se bajan aqui.
      #
      # Y el script comprueba el sha256 de cada uno contra el manifiesto
      # publicado antes de dejarlo. Eso quiere decir que este paso, ademas de
      # preparar las pruebas, **verifica que lo que hay publicado sigue siendo lo
      # que el catalogo declara**: si alguien publica un modulo con el hash
      # equivocado, el CI se entera aqui y no cuando alguien intente abrirlo.
      #
      # Lo que NO se hace, y es lo importante: no poner un "si no se puede
      # descargar, seguir igual". Un modulo que no se baja es un modulo que las
      # pruebas no comprueban, y una suite que comprueba menos de lo que parece es
      # peor que una suite que falla: la primera da verde.
      #
      # La cache es una comodidad, no una confianza. El script vuelve a comprobar el
      # sha256 de lo que haya en cache y lo vuelve a bajar si no cuadra, asi que una
      # cache vieja o corrupta no hace que las pruebas comprueben el fichero
      # equivocado: hacen que se vuelva a bajar.
      - name: cache de los modulos reales
        uses: actions/cache@v4
        with:
          path: test/fixtures/*.amod
          key: modulos-${{ hashFiles('test/fixtures/catalog_real.json') }}

      - name: bajar los modulos reales
        run: bash scripts/preparar-fixtures.sh

      - name: flutter test
        run: flutter test

      # LAS PRUEBAS CONTRA EL SITIO REAL, en su propio paso.
      #
      # Van aparte por dos razones. La primera es que no son hermeticas, y si
      # estuvieran en el paso anterior, un fallo de red haria fallar el despliegue
      # entero. La segunda es que son la unica comprobacion de que la resolucion
      # del problema de origen cruzado sigue siendo valida hoy: bajan un `.amod` de
      # verdad por el camino que usa el navegador y comprueban su sha256. Todo lo
      # demas demuestra que el codigo hace lo que dice; esto demuestra que el sitio
      # real responde.
      #
      # Necesitan `--run-skipped` ademas de `--tags red`, porque el `skip` de
      # `dart_test.yaml` manda siempre.
      - name: pruebas contra el sitio real
        run: flutter test --tags red --run-skipped

      - name: construir la version web
        run: flutter build web --release --base-href=/ab/

      # GitHub Pages no sabe servir el documento de entrada para rutas que no
      # existen: devuelve 404 con su propia pagina de error. Copiar `index.html`
      # a `404.html` hace que sirva la aplicacion con estado 404 y el
      # navegador la pinta igual, conservando la direccion, que es lo que
      # necesita el enrutador para saber que pasaje se ha pedido.
      # Sin esto, /ab/leer/KJV2006 no abre nada.
      - name: 404 para los enlaces profundos
        run: cp build/web/index.html build/web/404.html

      # `sqlite3.wasm` tiene que llegar al sitio como fichero estatico: es el
      # motor SQLite compilado, no se puede incrustar en el paquete. Si falta,
      # la app arranca y luego falla al abrir el primer modulo, que es el peor
      # sitio posible para descubrirlo.
      - name: comprobar que el motor SQLite viaja en el paquete
        run: |
          set -e
          test -f build/web/sqlite3.wasm
          echo "sqlite3.wasm: $(stat -c%s build/web/sqlite3.wasm) bytes"
          test -f build/web/404.html
          test -f build/web/index.html

      # ============================================================================
      # Y AQUI ESTABA EL DESPLEGUE, Y NO ESTA.
      #
      # Se quitan `upload-pages-artifact` y `deploy-pages`. Lo que se va es el sitio, no la
      # comprobacion: las tres que hay justo encima --`sqlite3.wasm` presente, `404.html`
      # presente, `index.html` presente-- son las que dicen si **el paquete** sirve, y el
      # paquete es lo que publica `scripts/publicar.sh`.
      #
      # Y DEJAR EL PASO, APUNTANDO A UN SITIO QUE ESTA CAIDO, ES PEOR QUE NO TENERLO: el
      # run acaba en verde y alguien cree que el sitio esta actualizado.